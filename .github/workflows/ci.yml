name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify repository artifacts
        shell: bash
        run: |
          git ls-files --error-unmatch addon-sdk.tgz
          if git ls-files node_modules | grep -q .; then
            echo "node_modules must not be committed"
            exit 1
          fi
          for private_file in .env .env.test; do
            if git ls-files --error-unmatch "$private_file" >/dev/null 2>&1; then
              echo "$private_file must not be committed"
              exit 1
            fi
          done
          if git ls-files .test-data | grep -q .; then
            echo ".test-data must not be committed"
            exit 1
          fi

      - name: Check pull request title format
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            perf
            test
            build
            ci
            style
            revert
          requireScope: false

      - name: Build and run test suite
        run: docker build --target test -t aiostreams-trakt-tracker:test .

      - name: Validate Compose configurations
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.test.example -f docker-compose.test.yml config --quiet

  release_please:
    name: Prepare release
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-image:
    name: Publish production image to GHCR
    needs: [verify, release_please]
    if: needs.release_please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out released source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_please.outputs.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/fiav1/aiostreams-trakt-tracker
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}},value=${{ needs.release_please.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release_please.outputs.tag_name }}

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
