name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify repository artifacts
        shell: bash
        run: |
          git ls-files --error-unmatch addon-sdk.tgz
          if git ls-files node_modules | grep -q .; then
            echo "node_modules must not be committed"
            exit 1
          fi
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo ".env must not be committed"
            exit 1
          fi

      - name: Build and run test suite
        run: docker build --target test -t aiostreams-trakt-tracker:test .
