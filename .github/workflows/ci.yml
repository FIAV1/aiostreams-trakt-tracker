name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Release Please tag to republish (for example aiostreams-trakt-tracker-v1.1.0)
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify repository artifacts
        shell: bash
        run: |
          git ls-files --error-unmatch addon-sdk.tgz
          if git ls-files node_modules | grep -q .; then
            echo "node_modules must not be committed"
            exit 1
          fi
          for private_file in .env .env.test; do
            if git ls-files --error-unmatch "$private_file" >/dev/null 2>&1; then
              echo "$private_file must not be committed"
              exit 1
            fi
          done
          if git ls-files .test-data | grep -q .; then
            echo ".test-data must not be committed"
            exit 1
          fi

      - name: Check pull request title format
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            perf
            test
            build
            ci
            style
            revert
          requireScope: false

      - name: Build and run test suite
        run: docker build --target test -t aiostreams-trakt-tracker:test .

      - name: Validate Compose configurations
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.test.example -f docker-compose.test.yml config --quiet

  release_please:
    name: Prepare release
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-image:
    name: Publish production image to GHCR
    needs: [verify, release_please]
    if: |
      always() &&
      needs.verify.result == 'success' &&
      ((github.event_name == 'push' && needs.release_please.outputs.release_created == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out released source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release_please.outputs.tag_name || inputs.release_tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image version from release tag
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release_please.outputs.tag_name || inputs.release_tag }}
        run: |
          version="${RELEASE_TAG##*-v}"
          if [[ "$version" == "$RELEASE_TAG" ]]; then
            version="${RELEASE_TAG#v}"
          fi
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag '$RELEASE_TAG' does not end in a stable semantic version." >&2
            exit 1
          fi
          IFS='.' read -r major minor patch <<< "$version"
          {
            echo "version=$version"
            echo "major_minor=$major.$minor"
          } >> "$GITHUB_OUTPUT"

      - name: Generate release image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/fiav1/aiostreams-trakt-tracker
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.major_minor }}

      - name: Build and push production image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
